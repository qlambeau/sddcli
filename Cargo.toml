[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/artifact-filesystem",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/qlambeau/sddcli"

[workspace.dependencies]
gherkin = { version = "0.16.0", default-features = true }
pretty_assertions = "1.4.1"
proptest = "1.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
rstest = { version = "0.26.1", default-features = false, features = ["crate-name"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
tempfile = "3.27.0"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
float_cmp = "deny"
indexing_slicing = "warn"
cognitive_complexity = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "deny"
